services:
  logpilot:
    build: .
    environment:
      - SERVICE_FQDN_LOGPILOT_8501
    env_file:
      - .env
    labels:
      - "traefik.http.services.logpilot.loadbalancer.server.port=8501"
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
      - cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
  reports:
  cache:
