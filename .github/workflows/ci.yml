name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: Kontrollera kodkvalitet (snabb, ~30s)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Check code style
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  # Job 2: Kontrollera säkerhet (parallellt med lint, ~1min)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit
      - name: Scan for security issues
        run: bandit -r logpilot/ -ll -q

  # Job 3: Kör tester (startar efter lint godkänts)
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,pdf]"
      - name: Run unit tests
        run: >
          pytest tests/
          --ignore=tests/test_app_e2e.py
          --ignore=tests/test_e2e_full.py
          --ignore=tests/test_scenario_e2e.py
          --ignore=tests/test_app_helpers.py
          -q --tb=short

  # Job 4: Verifiera att Docker-imagen bygger (efter tester godkänts)
  docker:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t logpilot:ci-test .
