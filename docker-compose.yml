services:
  logpilot:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
      - cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
  reports:
  cache:
