name: ws-log-parsing
description: Patterns for parsing multi-format logs — event boundaries, signal detection, format plugins, and extending the analyzer.
version: 2.0.0
tags: [domain, log-parsing, multi-format, websphere]

instructions: |
  # LogPilot Log Parsing Patterns

  ## Architecture

  All logic lives in the `logpilot/` package. Four layers:
  1. **Format plugins** (`logpilot/formats/`) — one module per format, each implementing `LogFormat`
  2. **Regex layer** (module-level compiled patterns) — timestamp, level, codes, exceptions, signals
  3. **Parsing layer** (`parse_file()`) — auto-detects format, splits log into events, classifies each
  4. **Reporting layer** (`summarize()`, `render_*_report()`) — aggregates and formats output

  `app.py` is a thin Streamlit UI that only imports from `logpilot`. Never add logic to `app.py`.

  ## Format Plugins

  Eight format plugins live in `logpilot/formats/`:

  | Plugin file     | Format name  | Typical log sources                          |
  |-----------------|--------------|----------------------------------------------|
  | `was.py`        | WAS          | WebSphere Application Server / Liberty       |
  | `json_log.py`   | JSON         | Bunyan, Pino, structlog, zap, Docker/K8s     |
  | `nginx.py`      | nginx        | nginx access and error logs                  |
  | `log4j.py`      | Log4j        | Log4j, Logback, Spring Boot, HikariCP, Kafka |
  | `python_log.py` | Python       | Django, Flask, FastAPI, Celery               |
  | `syslog.py`     | syslog       | RFC 3164/5424, journald, systemd             |
  | `enonic.py`     | Enonic XP    | server.log, Jetty request log                |
  | `crio.py`       | CRI-O/K8s    | Kubernetes CRI-O container logs, pod output  |

  ## LogFormat Protocol

  Every plugin implements `logpilot/formats/base.py::LogFormat` (a `typing.Protocol`):

  ```python
  class LogFormat(Protocol):
      name: str
      description: str

      def detect(self, lines: list[str]) -> float: ...
      # Score 0.0–1.0 how likely `lines` (first 50 non-empty) match this format.

      def extract_ts(self, line: str) -> str | None: ...
      # Return the timestamp string from a single log line, or None.

      def extract_level(self, line: str) -> str | None: ...
      # Return severity level string (ERROR, WARN, INFO, DEBUG, …) or None.

      def is_continuation(self, line: str) -> bool: ...
      # True if the line continues the previous event (stacktrace, Caused by:, …).

      def classify_event(self, text: str) -> dict[str, Any]: ...
      # Classify a full event block. Must return at minimum:
      # { level, thread_id, code, exception, root_cause, tags }

      def bucket_tags(self, text: str) -> set[str]: ...
      # Extract signal tags (OOM, HungThreads, DB/Pool, SSL, HTTP, …).
  ```

  Shared helpers (exception extraction, `is_stack_or_caused_by`, common regexes) live in
  `logpilot/formats/base.py` and are imported by individual plugins.

  ## Format Auto-Detection

  `parse_file()` calls `detect()` on every registered plugin with the first 50 non-empty lines
  of the file. The plugin with the highest score (≥ 0.1) wins. Ties go to the plugin listed
  first in the registry. If all scores are below threshold, the parser falls back to a generic
  line-by-line mode.

  **Ambiguity risk**: JSON-structured syslog and JSON-structured K8s logs can both score high
  on the JSON plugin. Write `detect()` to penalize fields that belong to the other format, or
  rely on field-name heuristics (e.g., `kubernetes.pod_name` → CRI-O plugin wins).

  ## Event Boundary Heuristic

  This is the trickiest part of the parser. A new event starts when:
  - A timestamp is found on the line, AND
  - There are already accumulated lines (`current` is non-empty), AND
  - The line is NOT a stacktrace continuation (`at com.ibm...`) or `Caused by:`

  Stacktraces and `Caused by:` chains MUST stay with their parent event.
  A blank line after a stacktrace triggers a flush.

  **Common mistake**: Breaking the stacktrace grouping by treating every timestamped line as a
  new event. Use `plugin.is_continuation(line)` (which calls `is_stack_or_caused_by()` from
  `base.py`) to guard against this.

  ## Event Model

  Each parsed event is a `dict` with at minimum these keys:

  | Key          | Type            | Description                                           |
  |--------------|-----------------|-------------------------------------------------------|
  | `text`       | `str`           | Full redacted event text (may be multi-line)          |
  | `level`      | `str`           | Normalized severity: ERROR / WARN / INFO / DEBUG      |
  | `ts`         | `str \| None`   | Raw timestamp string as found in the log              |
  | `ts_utc`     | `str \| None`   | Timestamp normalized to UTC ISO-8601 (when parseable) |
  | `tz_hint`    | `str \| None`   | Timezone hint extracted from the log line             |
  | `thread_id`  | `str \| None`   | Thread name or ID                                     |
  | `code`       | `str \| None`   | Message code (e.g. CWWKE0001I, SRVE0242I)             |
  | `exception`  | `str \| None`   | First exception class name found                      |
  | `root_cause` | `str \| None`   | Deepest `Caused by:` exception class                  |
  | `tags`       | `set[str]`      | Signal tags (OOM, HungThreads, DB/Pool, SSL, HTTP, …) |
  | `system_label` | `str \| None` | Source system label for cross-system analysis         |
  | `trace_ids`  | `list[str]`     | Trace/correlation IDs found in the event              |

  ## Cross-System Analysis

  When multiple log files from different systems are analyzed together:

  - Each file gets a `system_label` (e.g. `"nginx"`, `"app-server"`, `"database"`).
  - `sort_events_chronologically(events)` merges events from all sources by `ts_utc`.
  - `per_source_summary(events)` groups counts and top errors per `system_label`.
  - `trace_ids` on events enable correlation across systems (e.g. a request ID that appears
    in nginx access log and in a Java exception).

  ## Adding a New Signal Tag

  To detect a new pattern (e.g., ClassLoader issues):

  1. Add a compiled regex at module level in the relevant format plugin (or `base.py` if shared):
     ```python
     CLASSLOADER_RE = re.compile(r'ClassNotFoundException|NoClassDefFoundError|LinkageError', re.IGNORECASE)
     ```

  2. Add detection in that plugin's `bucket_tags()`:
     ```python
     if CLASSLOADER_RE.search(text): tags.add("ClassLoader")
     ```

  3. Add a test in `tests/test_format_<name>.py` (or `test_parsing.py` for generic):
     ```python
     def test_bucket_tags_classloader():
         tags = bucket_tags("java.lang.ClassNotFoundException: com.example.Missing")
         assert "ClassLoader" in tags
     ```

  The tag flows through `summarize()`, reports, and the GUI automatically.

  ## WAS Severity Precedence

  WebSphere uses single-letter severity codes (I/A/W/E/O/F/R/D) after the thread ID.
  These are authoritative and take priority over keyword matching (ERROR, WARNING, etc.)
  in the message body.

  Only fall back to keyword matching for non-WAS log formats (e.g., plain Java logs).

  ## Secret Redaction

  `redact()` runs on ALL event text before it enters the event list.
  Patterns: bearer tokens, passwords, API keys, tokens, secrets.

  **Rule**: Never output raw log text without redaction. The `parse_file()` pipeline
  calls `redact()` in the `flush()` closure before appending events.

  ## Adding a New Format Plugin

  1. Create `logpilot/formats/<name>.py` implementing all `LogFormat` methods.
  2. Register the class in `logpilot/formats/__init__.py` plugin list.
  3. Add sample lines to `detect()` scoring tests in `tests/test_format_<name>.py`.
  4. Add a skill file in `skills/<name>-analysis.md` with domain patterns.

  ## Testing Conventions

  - Use string constants (SAMPLE_LOG, STACKTRACE_LOG, etc.) as inline fixtures, not real log files
  - Use `tmp_path` fixture for file-based tests
  - Test regexes directly for pattern matching; use `parse_file()` for integration tests
  - Every new signal tag needs a test in `test_bucket_tags_*`
  - Every format plugin has its own `tests/test_format_<name>.py`
  - See `.claude/skills/testing.md` for full test conventions and run commands
