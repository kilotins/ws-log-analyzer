[project]
name = "ws-log-analyzer"
version = "0.1.0"
description = "WebSphere/Java log analyzer for quick triage"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.5"]
openai = ["openai>=1.0"]
gui = ["streamlit>=1.30"]
test = ["pytest>=7"]
e2e = ["pytest>=7", "playwright>=1.40"]

[tool.setuptools]
py-modules = ["wslog", "app"]

[project.scripts]
wslog = "wslog:main"
