[project]
name = "logpilot"
version = "0.1.0"
description = "LogPilot — Multi-format log analyzer with AI-powered triage (WAS, nginx, Log4j, Python, syslog, K8s, JSON, Enonic)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.5"]
openai = ["openai>=1.0"]
gui = ["streamlit>=1.30", "plotly>=5.0"]
pdf = ["fpdf2>=2.7"]
test = ["pytest>=7"]
e2e = ["pytest>=7", "playwright>=1.40"]

[tool.setuptools]
packages = ["logpilot"]
py-modules = ["app"]

[project.scripts]
logpilot = "logpilot.cli:main"

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
