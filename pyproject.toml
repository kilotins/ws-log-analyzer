[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpilot"
version = "1.5.1"
description = "Multi-format log analyzer with AI-powered root cause analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Item Consulting", email = "post@item.no"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.5"]
openai = ["openai>=1.0"]
gui = ["streamlit>=1.36", "plotly>=5.0"]
pdf = ["fpdf2>=2.7"]
all-ai = ["anthropic>=0.40", "google-generativeai>=0.5", "openai>=1.0"]
all = ["logpilot[gui,all-ai,pdf]"]
test = ["pytest>=7"]
e2e = ["pytest>=7", "playwright>=1.40", "pytest-playwright>=0.4"]
dev = ["pytest>=7", "ruff", "mypy", "build", "twine"]

[project.scripts]
logpilot = "logpilot.cli:main"
logpilot-gui = "logpilot.gui:main"

[project.urls]
Homepage = "https://github.com/kilotins/ws-log-analyzer"
Repository = "https://github.com/kilotins/ws-log-analyzer"
Issues = "https://github.com/kilotins/ws-log-analyzer/issues"

[tool.setuptools]
packages = ["logpilot", "logpilot.formats", "logpilot.reports"]
py-modules = ["app", "app_ai", "app_render", "app_incident", "app_audit", "app_spend", "app_realtime", "app_jira", "app_constants", "report_renderer"]

[tool.setuptools.package-data]
logpilot = ["heuristics_data.yaml"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
